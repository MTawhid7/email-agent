name: Build Desktop App

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # allows manual trigger from the GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── macOS → Email Agent.app ──────────────────────────────────────────────────
  build-mac:
    name: Build macOS (.app)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller email_agent.spec

      - name: Fix permissions on executable
        run: chmod +x "dist/Email Agent.app/Contents/MacOS/Email Agent"

      - name: Package .app with ditto (preserves permissions & resource forks)
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Email Agent.app" "dist/Email-Agent-Mac.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: Email-Agent-Mac
          path: dist/Email-Agent-Mac.zip
          retention-days: 30

  # ── Windows → Email Agent.exe ─────────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller email_agent.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: Email-Agent-Windows
          path: "dist/Email Agent.exe"
          retention-days: 30
