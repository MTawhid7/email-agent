{% extends "base.html" %}
{% block title %}Dashboard — Email Agent{% endblock %}

{% block content %}
<div class="max-w-3xl">
  <h1 class="text-2xl font-semibold text-gray-900 mb-6">Dashboard</h1>

  <!-- Status card -->
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 mb-6">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div id="status-dot" class="w-3 h-3 rounded-full bg-gray-300"></div>
        <div>
          <p id="status-text" class="text-base font-medium text-gray-800">Stopped</p>
          <p class="text-xs text-gray-400">Drafts created today: <span id="draft-count">0</span></p>
        </div>
      </div>
      <button id="toggle-btn" onclick="toggleAgent()"
        class="px-5 py-2 rounded-lg text-sm font-medium transition-colors bg-blue-600 hover:bg-blue-700 text-white">
        Start Agent
      </button>
    </div>

    <!-- Error banner -->
    <div id="error-banner" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"></div>
  </div>

  <!-- Activity log -->
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
    <h2 class="text-sm font-semibold text-gray-700 mb-3">Activity Log</h2>
    <div id="log-container" class="space-y-1 max-h-96 overflow-y-auto font-mono text-xs">
      <p class="text-gray-400 italic" id="log-empty">No activity yet. Start the agent to begin.</p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let isRunning = false;
  let lastLogCount = 0;

  function toggleAgent() {
    const endpoint = isRunning ? '/api/agent/stop' : '/api/agent/start';
    fetch(endpoint, { method: 'POST' })
      .then(() => refreshStatus())
      .catch(console.error);
  }

  function refreshStatus() {
    fetch('/api/status')
      .then(r => r.json())
      .then(data => {
        isRunning = data.running;

        // Status dot
        const dot = document.getElementById('status-dot');
        dot.className = 'w-3 h-3 rounded-full ' + (data.running ? 'bg-green-500' : 'bg-gray-300');

        // Status text
        document.getElementById('status-text').textContent = data.running ? 'Running' : 'Stopped';

        // Button
        const btn = document.getElementById('toggle-btn');
        btn.textContent = data.running ? 'Stop Agent' : 'Start Agent';
        btn.className = 'px-5 py-2 rounded-lg text-sm font-medium transition-colors ' +
          (data.running
            ? 'bg-red-100 hover:bg-red-200 text-red-700'
            : 'bg-blue-600 hover:bg-blue-700 text-white');

        // Draft count
        document.getElementById('draft-count').textContent = data.draft_count || 0;

        // Error
        const banner = document.getElementById('error-banner');
        if (data.error) {
          banner.textContent = data.error;
          banner.classList.remove('hidden');
        } else {
          banner.classList.add('hidden');
        }

        // Log entries — only append new ones
        if (data.logs && data.logs.length > lastLogCount) {
          const container = document.getElementById('log-container');
          document.getElementById('log-empty')?.remove();
          const newEntries = data.logs.slice(lastLogCount);
          newEntries.forEach(entry => {
            const div = document.createElement('div');
            const color = entry.level === 'success' ? 'text-green-700'
                        : entry.level === 'error'   ? 'text-red-600'
                        : 'text-gray-600';
            div.className = 'flex gap-2 py-0.5';
            div.innerHTML = `<span class="text-gray-400 shrink-0">${entry.timestamp}</span>
                             <span class="${color}">${entry.message}</span>`;
            container.appendChild(div);
          });
          lastLogCount = data.logs.length;
          container.scrollTop = container.scrollHeight;
        }
      })
      .catch(console.error);
  }

  // Poll every 5 seconds
  refreshStatus();
  setInterval(refreshStatus, 5000);
</script>
{% endblock %}
