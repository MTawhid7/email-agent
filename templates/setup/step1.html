<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — Email Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md">

    <!-- Step indicator -->
    <div class="flex items-center justify-center gap-2 mb-8">
      {% for i in range(1, 5) %}
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-semibold
            {% if i == 1 %}bg-blue-600 text-white{% elif i < 1 %}bg-blue-200 text-blue-700{% else %}bg-gray-200 text-gray-500{% endif %}">
            {{ i }}
          </div>
          {% if i < 4 %}<div class="w-8 h-px {% if i < 1 %}bg-blue-300{% else %}bg-gray-300{% endif %}"></div>{% endif %}
        </div>
      {% endfor %}
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <h1 class="text-xl font-semibold text-gray-900 mb-1">Gemini API Key</h1>
      <p class="text-sm text-gray-500 mb-6">The AI that writes your email replies. Get a free key at <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-blue-600 underline">aistudio.google.com</a>.</p>

      {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">{{ error }}</div>
      {% endif %}

      <form method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">API Key</label>
          <input type="password" name="gemini_api_key" placeholder="AIza..."
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Model</label>
          <input type="text" name="gemini_model" value="gemini-3.1-flash-lite"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          <p class="text-xs text-gray-400 mt-1">Leave as default unless you have a specific model in mind.</p>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition-colors">
          Continue →
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-4">Step 1 of 4</p>
  </div>
</body>
</html>
